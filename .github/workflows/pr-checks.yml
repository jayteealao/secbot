# Created by wf ship-plan build — plan v1, 2026-10-05
# Patched by wf ship-plan build — plan v2, 2026-10-05 (osv-scanner and license-check)
# Required pre-merge checks for main (ship plan Blocks C, H, K).
# Gates whose code does not exist yet are inert until their repo variable is "true":
#   SDLC_GATE_NODE   — a committed pnpm-lock.yaml exists
#   SDLC_GATE_SERVER — server or extension packages exist under packages/
#   SDLC_GATE_APP    — the Gradle app exists under app/
# A skipped job still reports success, so inert gates never block a merge.
name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  biome:
    name: biome
    if: ${{ vars.SDLC_GATE_NODE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-env
        with:
          forks-token: ${{ secrets.FORKS_READ_TOKEN }}
      - name: Format and lint (Biome)
        run: pnpm biome ci .

  type-check:
    name: type-check
    if: ${{ vars.SDLC_GATE_SERVER == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-env
        with:
          forks-token: ${{ secrets.FORKS_READ_TOKEN }}
      - name: Type-check (tsc strict)
        run: pnpm -r exec tsc --noEmit

  test-server:
    name: test-server
    if: ${{ vars.SDLC_GATE_SERVER == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-env
        with:
          forks-token: ${{ secrets.FORKS_READ_TOKEN }}
      - name: Test with coverage (80% lines minimum)
        run: pnpm -r exec vitest run --coverage --coverage.thresholds.lines=80

  ktlint:
    name: ktlint
    if: ${{ vars.SDLC_GATE_APP == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: java
          cache: true
      - uses: gradle/actions/setup-gradle@v6
      - name: Kotlin format (ktlint)
        run: ./gradlew -p app ktlintCheck

  detekt:
    name: detekt
    if: ${{ vars.SDLC_GATE_APP == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: java
          cache: true
      - uses: gradle/actions/setup-gradle@v6
      - name: Kotlin lint (detekt)
        run: ./gradlew -p app detekt

  app-build:
    name: app-build
    if: ${{ vars.SDLC_GATE_APP == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: java
          cache: true
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the Android debug app
        run: ./gradlew -p app assembleDebug

  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lint commit messages (conventional)
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Addresses, private-network hostnames, account ids, and ping URLs (no dependencies needed).
      - name: Scan for identifiers
        run: node scripts/check-identifiers.mjs

  osv-scanner:
    name: osv-scanner
    if: ${{ vars.SDLC_GATE_NODE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: node osv-scanner
          cache: true
      # Fails on CVSS 7.0 or higher, on any unscored finding, and on any MAL-* id, unless
      # osv-scanner.toml lists the id with a reason and an expiry date.
      - name: Scan dependencies
        run: mise run audit:deps

  license-check:
    name: license-check
    if: ${{ vars.SDLC_GATE_NODE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-env
        with:
          forks-token: ${{ secrets.FORKS_READ_TOKEN }}
      - name: Enforce the license allowlist
        run: mise run audit:licenses

  dry-run:
    name: dry-run
    if: ${{ vars.SDLC_GATE_SERVER == 'true' }}
    needs: [biome, type-check, test-server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-env
        with:
          forks-token: ${{ secrets.FORKS_READ_TOKEN }}
      # No deploy credentials on PRs: the dry-run builds the bundle only.
      # The diff against the live test cell runs in release-server.yml.
      - name: Publish dry-run
        run: mise run deploy:dry-run
