# Created by wf ship-plan build — plan v1, 2026-10-05
# Patched by wf ship-plan build — plan v2, 2026-10-05
# App release (ship plan contract mobile-app-store): unsigned builds → one
# production approval → sign, upload to Play internal testing and TestFlight, and
# check processing in one job → SBOM.
# Signing material and store credentials live only in the production environment.
# GitHub asks for an approval on every job in that environment, so signing, both
# uploads, and the processing check share one job, and signed builds never become
# workflow artifacts. iOS builds run on GitHub-hosted macOS, never on a self-hosted runner.
#
# Inert until SDLC_GATE_APP_RELEASE is "true" (the app exists, the store accounts
# and signing material are in place, and the app:* mise tasks are real).
# Set the repo variable APP_PACKAGE_NAME to the Android application id.
name: Release (app)

on:
  push:
    tags: ["app-v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-app
  cancel-in-progress: false

jobs:
  build-android:
    if: ${{ vars.SDLC_GATE_APP_RELEASE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Refuse a tag whose commit is not on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::The tag commit $GITHUB_SHA is not on main"
            exit 1
          fi
      - uses: jdx/mise-action@v5
        with:
          install_args: java
          cache: true
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the unsigned Android bundle
        run: ./gradlew -p app bundleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: android-unsigned
          path: app/androidApp/build/outputs/bundle/release/
          if-no-files-found: error
          retention-days: 1

  build-ios:
    if: ${{ vars.SDLC_GATE_APP_RELEASE == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Refuse a tag whose commit is not on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::The tag commit $GITHUB_SHA is not on main"
            exit 1
          fi
      - uses: jdx/mise-action@v5
        with:
          install_args: node java
          cache: true
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the unsigned iOS archive
        run: mise run app:build-ios
      - uses: actions/upload-artifact@v7
        with:
          name: ios-unsigned
          path: build/ios/
          if-no-files-found: error
          retention-days: 1

  sign-and-upload:
    needs: [build-android, build-ios]
    runs-on: macos-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: node java
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: android-unsigned
          path: build/android/
      - uses: actions/download-artifact@v8
        with:
          name: ios-unsigned
          path: build/ios/
      - name: Sign the Android bundle and export the signed iOS build
        run: mise run app:sign
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      - name: Upload to Play internal testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.APP_PACKAGE_NAME }}
          releaseFiles: build/signed/android/*.aab
          track: internal
          status: completed
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: build/signed/ios/Secbot.ipa
          app-type: ios
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_PRIVATE_KEY }}
      - name: Check that both test tracks processed the build
        uses: ./.github/actions/poll-check
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        with:
          cmd: mise run check:app-builds -- --version "$GITHUB_REF_NAME"
          max-minutes: "60"
          interval-seconds: "60"

  sbom:
    needs: sign-and-upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate the SPDX SBOM for the app
        uses: anchore/sbom-action@v0
        with:
          path: app
          format: spdx-json
          output-file: secbot-${{ github.ref_name }}.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: app-sbom
          path: secbot-${{ github.ref_name }}.spdx.json

  github-release:
    needs: sbom
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app-sbom
      # release-please already created the release for this tag; this adds the SBOM.
      - name: Attach the SBOM to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: secbot-${{ github.ref_name }}.spdx.json
          fail_on_unmatched_files: true
