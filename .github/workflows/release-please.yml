# Created by wf ship-plan build — plan v1, 2026-10-05
# Opens one release PR per component (server ".", app "app"). Merging a release PR
# creates the tag (v* or app-v*) as the developer GitHub App, which starts the
# matching release workflow. A tag pushed with GITHUB_TOKEN would not start it.
# Inert until SDLC_GATE_RELEASE_PLEASE is "true" (the developer App exists).
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ vars.SDLC_GATE_RELEASE_PLEASE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Mint a developer App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEV_APP_ID }}
          private-key: ${{ secrets.DEV_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
