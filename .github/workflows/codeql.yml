# Created by wf ship-plan build — plan v1, 2026-10-05
# SAST (ship plan Block K). Inert per language until its code exists:
#   SDLC_GATE_SERVER — TypeScript packages exist under packages/
#   SDLC_GATE_APP    — the Gradle app exists under app/
name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql-javascript-typescript:
    name: codeql-javascript-typescript
    if: ${{ vars.SDLC_GATE_SERVER == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  codeql-java-kotlin:
    name: codeql-java-kotlin
    if: ${{ vars.SDLC_GATE_APP == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install_args: java
          cache: true
      - uses: gradle/actions/setup-gradle@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: autobuild
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
