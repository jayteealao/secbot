# Created by wf ship-plan build — plan v1, 2026-10-05
# Server release (ship plan Blocks A–E): build → conformance → SBOM → test cell →
# one production approval → staged in-place rollout → GitHub release.
#
# Environments:
#   test-cell          — no reviewer; auto-promotes when verify-test-cell passes
#   production         — @jayteealao must approve; used once, by snapshot-cells
#   production-rollout — no reviewer; v* and app-v* tags only; used by the later stages
# Each environment holds the PRIVATE_NET_* and VPS_* secrets.
#
# Inert until SDLC_GATE_SERVER_RELEASE is "true" (the VPS, the test cell, and the
# environments exist, and the mise deploy and check tasks are real).
name: Release (server)

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-server
  cancel-in-progress: false

jobs:
  build:
    if: ${{ vars.SDLC_GATE_SERVER_RELEASE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-env
        with:
          forks-token: ${{ secrets.FORKS_READ_TOKEN }}
      - name: Build the server bundle
        run: mise run build
      - uses: actions/upload-artifact@v7
        with:
          name: server-bundle
          path: dist/
          if-no-files-found: error

  conformance:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-env
        with:
          forks-token: ${{ secrets.FORKS_READ_TOKEN }}
      - name: Run the pi-durable storage conformance suite
        run: mise run test:conformance

  sbom:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate the SPDX SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: secbot-${{ github.ref_name }}.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: secbot-${{ github.ref_name }}.spdx.json

  deploy-test-cell:
    needs: [conformance, sbom]
    runs-on: ubuntu-latest
    environment: test-cell
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-env
        with:
          install: "false"
      - uses: actions/download-artifact@v8
        with:
          name: server-bundle
          path: dist/
      - uses: ./.github/actions/vps-access
        with:
          oauth-client-id: ${{ secrets.PRIVATE_NET_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.PRIVATE_NET_OAUTH_SECRET }}
          host: ${{ secrets.VPS_DEPLOY_HOST }}
          ssh-key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      - name: Deploy to the test cell
        run: mise run deploy -- --env test-cell --version ${{ github.ref_name }}

  verify-test-cell:
    needs: deploy-test-cell
    runs-on: ubuntu-latest
    environment: test-cell
    env:
      HEARTBEAT_API_TOKEN: ${{ secrets.HEARTBEAT_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-env
        with:
          install: "false"
      - uses: ./.github/actions/vps-access
        with:
          oauth-client-id: ${{ secrets.PRIVATE_NET_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.PRIVATE_NET_OAUTH_SECRET }}
          host: ${{ secrets.VPS_DEPLOY_HOST }}
          ssh-key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      - name: Check cell health
        uses: ./.github/actions/poll-check
        with:
          cmd: mise run check:cells -- --env test-cell --version ${{ github.ref_name }}
      - name: Check alarms
        uses: ./.github/actions/poll-check
        with:
          cmd: mise run check:alarms -- --env test-cell
          min-minutes: "0"
      - name: Check heartbeats
        uses: ./.github/actions/poll-check
        with:
          cmd: mise run check:heartbeats -- --since-deploy
          min-minutes: "0"

  snapshot-cells:
    needs: verify-test-cell
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-env
        with:
          install: "false"
      - uses: ./.github/actions/vps-access
        with:
          oauth-client-id: ${{ secrets.PRIVATE_NET_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.PRIVATE_NET_OAUTH_SECRET }}
          host: ${{ secrets.VPS_DEPLOY_HOST }}
          ssh-key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      - name: Confirm a fresh bucket snapshot of every production cell
        run: mise run snapshot -- --env production

  deploy-owner-cell:
    needs: snapshot-cells
    runs-on: ubuntu-latest
    environment: production-rollout
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-env
        with:
          install: "false"
      - uses: actions/download-artifact@v8
        with:
          name: server-bundle
          path: dist/
      - uses: ./.github/actions/vps-access
        with:
          oauth-client-id: ${{ secrets.PRIVATE_NET_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.PRIVATE_NET_OAUTH_SECRET }}
          host: ${{ secrets.VPS_DEPLOY_HOST }}
          ssh-key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      - name: Deploy to the owner cell
        run: mise run deploy -- --env production --version ${{ github.ref_name }} --cells owner

  verify-owner-cell:
    needs: deploy-owner-cell
    runs-on: ubuntu-latest
    environment: production-rollout
    env:
      HEARTBEAT_API_TOKEN: ${{ secrets.HEARTBEAT_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-env
        with:
          install: "false"
      - uses: ./.github/actions/vps-access
        with:
          oauth-client-id: ${{ secrets.PRIVATE_NET_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.PRIVATE_NET_OAUTH_SECRET }}
          host: ${{ secrets.VPS_DEPLOY_HOST }}
          ssh-key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      - name: Check cell health
        uses: ./.github/actions/poll-check
        with:
          cmd: mise run check:cells -- --env production --version ${{ github.ref_name }} --cells owner
      - name: Check alarms
        uses: ./.github/actions/poll-check
        with:
          cmd: mise run check:alarms -- --env production --cells owner
          min-minutes: "0"
      - name: Check heartbeats
        uses: ./.github/actions/poll-check
        with:
          cmd: mise run check:heartbeats -- --since-deploy --cells owner
          min-minutes: "0"

  deploy-person-and-household-cells:
    needs: verify-owner-cell
    runs-on: ubuntu-latest
    environment: production-rollout
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-env
        with:
          install: "false"
      - uses: actions/download-artifact@v8
        with:
          name: server-bundle
          path: dist/
      - uses: ./.github/actions/vps-access
        with:
          oauth-client-id: ${{ secrets.PRIVATE_NET_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.PRIVATE_NET_OAUTH_SECRET }}
          host: ${{ secrets.VPS_DEPLOY_HOST }}
          ssh-key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      - name: Deploy to the second person cell and the household cell
        run: mise run deploy -- --env production --version ${{ github.ref_name }} --cells person,household

  verify-person-and-household-cells:
    needs: deploy-person-and-household-cells
    runs-on: ubuntu-latest
    environment: production-rollout
    env:
      HEARTBEAT_API_TOKEN: ${{ secrets.HEARTBEAT_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-env
        with:
          install: "false"
      - uses: ./.github/actions/vps-access
        with:
          oauth-client-id: ${{ secrets.PRIVATE_NET_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.PRIVATE_NET_OAUTH_SECRET }}
          host: ${{ secrets.VPS_DEPLOY_HOST }}
          ssh-key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      - name: Check cell health
        uses: ./.github/actions/poll-check
        with:
          cmd: mise run check:cells -- --env production --version ${{ github.ref_name }} --cells person,household
      - name: Check alarms
        uses: ./.github/actions/poll-check
        with:
          cmd: mise run check:alarms -- --env production --cells person,household
          min-minutes: "0"
      - name: Check heartbeats
        uses: ./.github/actions/poll-check
        with:
          cmd: mise run check:heartbeats -- --since-deploy --cells person,household
          min-minutes: "0"

  deploy-secrets-cell:
    needs: verify-person-and-household-cells
    runs-on: ubuntu-latest
    environment: production-rollout
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-env
        with:
          install: "false"
      - uses: actions/download-artifact@v8
        with:
          name: server-bundle
          path: dist/
      - uses: ./.github/actions/vps-access
        with:
          oauth-client-id: ${{ secrets.PRIVATE_NET_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.PRIVATE_NET_OAUTH_SECRET }}
          host: ${{ secrets.VPS_DEPLOY_HOST }}
          ssh-key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      - name: Deploy to the secrets cell
        run: mise run deploy -- --env production --version ${{ github.ref_name }} --cells secrets

  verify-all-cells:
    needs: deploy-secrets-cell
    runs-on: ubuntu-latest
    environment: production-rollout
    env:
      HEARTBEAT_API_TOKEN: ${{ secrets.HEARTBEAT_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-env
        with:
          install: "false"
      - uses: ./.github/actions/vps-access
        with:
          oauth-client-id: ${{ secrets.PRIVATE_NET_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.PRIVATE_NET_OAUTH_SECRET }}
          host: ${{ secrets.VPS_DEPLOY_HOST }}
          ssh-key: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
      - name: Check cell health
        uses: ./.github/actions/poll-check
        with:
          cmd: mise run check:cells -- --env production --version ${{ github.ref_name }}
      - name: Check alarms
        uses: ./.github/actions/poll-check
        with:
          cmd: mise run check:alarms -- --env production
          min-minutes: "0"
      - name: Check heartbeats
        uses: ./.github/actions/poll-check
        with:
          cmd: mise run check:heartbeats -- --since-deploy
          min-minutes: "0"

  github-release:
    needs: verify-all-cells
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sbom
      - uses: actions/download-artifact@v8
        with:
          name: server-bundle
          path: dist/
      - name: Package the server bundle
        run: tar -czf secbot-${{ github.ref_name }}.tar.gz -C dist .
      # release-please already created the release for this tag; this adds the assets.
      - name: Attach the bundle and the SBOM to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            secbot-${{ github.ref_name }}.tar.gz
            secbot-${{ github.ref_name }}.spdx.json
          fail_on_unmatched_files: true
