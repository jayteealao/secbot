# The fleets this run sets up: the test fleet always; the production fleets with
# -e celld_production=true. Each fleet starts once its bucket's smoke test is confirmed.
- name: Choose the fleets this run sets up
  ansible.builtin.set_fact:
    celld_active_instances: >-
      {{ celld_instances | selectattr('env', 'equalto', 'test-cell') | list
         + (celld_instances | selectattr('env', 'equalto', 'production') | list
            if (celld_production | bool) else []) }}
    celld_started_instances: >-
      {{ (celld_instances | selectattr('env', 'equalto', 'test-cell') | list
          if (celld_replication_confirmed | bool) else [])
         + (celld_instances | selectattr('env', 'equalto', 'production') | list
            if (celld_production | bool) and (celld_production_confirmed | bool) else []) }}

- name: Check that every value the fleets need is in the environment
  ansible.builtin.assert:
    that: lookup('ansible.builtin.env', item) | length > 0
    fail_msg: "Set {{ item }} in your shell (see the infra/tofu outputs)."
    quiet: true
  loop: >-
    {{ (['SECBOT_R2_ENDPOINT']
       + (celld_active_instances | map(attribute='bucket_env') | list)
       + (celld_active_instances | map(attribute='access_key_env') | list)
       + (celld_active_instances | map(attribute='secret_key_env') | list)
       + (celld_active_instances | selectattr('heartbeat_env', 'defined')
          | map(attribute='heartbeat_env') | list)) | unique }}
  delegate_to: localhost
  become: false
  run_once: true

- name: Read the private-network address of the VPS
  ansible.builtin.set_fact:
    celld_private_address: "{{ ansible_facts[celld_private_interface]['ipv4']['address'] }}"

- name: Create the celld system user
  ansible.builtin.user:
    name: celld
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/celld
    create_home: false

- name: Create the download cache
  ansible.builtin.file:
    path: /var/cache/secbot
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download the pinned celld release
  ansible.builtin.get_url:
    url: "https://github.com/denoland/celld/releases/download/v{{ celld_version }}/celld-{{ ansible_facts['architecture'] }}-unknown-linux-gnu.gz"
    dest: "/var/cache/secbot/celld-{{ celld_version }}-{{ ansible_facts['architecture'] }}.gz"
    checksum: "sha256:{{ celld_sha256[ansible_facts['architecture']] }}"
    mode: "0644"
  register: celld_download

- name: Read whether the celld binary is installed
  ansible.builtin.stat:
    path: /usr/local/bin/celld
  register: celld_binary

# Runs only for a new download or a missing binary, so a repeat run reports no change and does
# not restart the cells.
- name: Install the celld binary
  ansible.builtin.shell: |
    set -o pipefail
    gunzip -c "{{ celld_download.dest }}" > /usr/local/bin/celld.new
    chmod 0755 /usr/local/bin/celld.new
    mv -f /usr/local/bin/celld.new /usr/local/bin/celld
  args:
    executable: /bin/bash
  when: celld_download is changed or not celld_binary.stat.exists
  changed_when: true
  notify: Restart celld instances

- name: Download the pinned esbuild binary
  ansible.builtin.get_url:
    url: "https://registry.npmjs.org/@esbuild/linux-{{ esbuild_arch }}/-/linux-{{ esbuild_arch }}-{{ celld_esbuild_version }}.tgz"
    dest: "/var/cache/secbot/esbuild-{{ celld_esbuild_version }}-{{ ansible_facts['architecture'] }}.tgz"
    checksum: "sha512:{{ celld_esbuild_sha512[ansible_facts['architecture']] }}"
    mode: "0644"
  vars:
    esbuild_arch: "{{ 'x64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"
  register: celld_esbuild_download

- name: Read whether the esbuild binary is installed
  ansible.builtin.stat:
    path: /usr/local/bin/esbuild
  register: celld_esbuild_binary

- name: Install the esbuild binary
  ansible.builtin.shell: |
    set -o pipefail
    tar -xzOf "{{ celld_esbuild_download.dest }}" package/bin/esbuild > /usr/local/bin/esbuild.new
    chmod 0755 /usr/local/bin/esbuild.new
    mv -f /usr/local/bin/esbuild.new /usr/local/bin/esbuild
  args:
    executable: /bin/bash
  when: celld_esbuild_download is changed or not celld_esbuild_binary.stat.exists
  changed_when: true

- name: Create the secbot configuration directory
  ansible.builtin.file:
    path: /etc/secbot
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write each fleet's environment file (root and celld only)
  ansible.builtin.template:
    src: celld.env.j2
    dest: "/etc/secbot/celld-{{ item.name }}.env"
    owner: root
    group: celld
    mode: "0640"
  loop: "{{ celld_active_instances }}"
  loop_control:
    label: "celld-{{ item.name }}.env"
  no_log: true
  notify: Restart celld instances

- name: Write each fleet's release-tool file (readable by its deploy users only)
  ansible.builtin.template:
    src: celld.env.j2
    dest: "/etc/secbot/fleet-{{ item.name }}.env"
    owner: root
    group: "{{ item.group }}"
    mode: "0640"
  loop: "{{ celld_active_instances }}"
  loop_control:
    label: "fleet-{{ item.name }}.env"
  no_log: true

- name: Remove the release-tool file of the single-fleet layout
  ansible.builtin.file:
    path: /etc/secbot/test-cell.env
    state: absent

- name: Install the celld unit template
  ansible.builtin.template:
    src: celld@.service.j2
    dest: /etc/systemd/system/celld@.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart celld instances

- name: Check each bucket's conditional writes (celld diagnose)
  ansible.builtin.shell: |
    set -o pipefail
    set -a; . "/etc/secbot/celld-{{ item.name }}.env"; set +a
    /usr/local/bin/celld diagnose --bucket "$CELLD_BUCKET" --endpoint "$CELLD_ENDPOINT" --region auto
  args:
    executable: /bin/bash
  loop: "{{ celld_active_instances }}"
  loop_control:
    label: "celld diagnose ({{ item.name }})"
  register: celld_diagnose
  changed_when: false

- name: Stop here until the bucket smoke test has passed
  ansible.builtin.debug:
    msg: >-
      celld@{{ item.name }} is installed but not started. Run mise run smoke:r2 against its
      bucket; when it passes, run host:setup again with
      {{ '-e celld_replication_confirmed=true' if item.env == 'test-cell'
         else '-e celld_production=true -e celld_production_confirmed=true' }} to start it.
  loop: "{{ celld_active_instances | difference(celld_started_instances) }}"
  loop_control:
    label: "celld@{{ item.name }}"

- name: Record the smoke test pass that the release tool checks
  ansible.builtin.copy:
    dest: "/var/lib/secbot/smoke-{{ item.name }}.ok"
    content: "celld diagnose and smoke:r2 passed before replication was turned on\n"
    owner: root
    group: secbot
    mode: "0644"
  loop: "{{ celld_started_instances }}"
  loop_control:
    label: "smoke-{{ item.name }}.ok"

- name: Enable and start each confirmed fleet (replication on)
  ansible.builtin.systemd_service:
    name: "celld@{{ item.name }}"
    enabled: true
    state: started
  loop: "{{ celld_started_instances }}"
  loop_control:
    label: "celld@{{ item.name }}"
