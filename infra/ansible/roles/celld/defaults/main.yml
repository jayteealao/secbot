# celld release pin. Renovate's fork-sync group bumps celld_version; update the digests with it
# (GitHub release asset digests for denoland/celld v0.6.1, read 2026-10-05).
celld_version: "0.6.1"
celld_sha256:
  x86_64: "79a8253cff5d4e8a4a9f7a2611e393390f7fe9025f00e88467875b007c44866b"
  aarch64: "ab99053bcced225bb5b54f428792260c905b782b8a61947362a12ce3a9c22def"
# celld deploy runs esbuild from PATH (celld README); same version as pnpm-lock.yaml
# (npm registry integrity of @esbuild/linux-* 0.28.2, as hex).
celld_esbuild_version: "0.28.2"
celld_esbuild_sha512:
  x86_64: "e314d9af5154992a105b85c85a68addedcd0ad44d933e3773f45d5f3144e298179d177c8ef178ef74fb56d9bcdc3122e7d0f610d0551247e588603d517c03f1d"
  aarch64: "a56e000b43f78adf1cedda3d315338a79d45cc7cdd33f4d9adeaeeae045c1c9d964dad55435088ab5f319dc7e9049c38a23922659aca5b6c8805604ff768fa52"

# celld_ports and celld_private_interface live in group_vars/all.yml, because the firewall role
# reads them too.

# Instances (fleets). celld runs one application per fleet (celld v0.6.1 README, "A fleet runs
# one application"), so each production rollout stage is its own fleet: prod-owner serves the
# owner cell, prod-shared the second person's cell and the household cell. Both share the
# production bucket by key prefix (celld v0.6.1 docs/README.md:267-270). The test cell is one
# fleet that serves every cell. Ports come from celld_ports in group_vars/all.yml.
celld_instances:
  - name: test
    env: test-cell
    group: secbot-test
    bucket_env: SECBOT_TEST_BUCKET
    prefix: ""
    access_key_env: SECBOT_TEST_R2_ACCESS_KEY_ID
    secret_key_env: SECBOT_TEST_R2_SECRET_ACCESS_KEY
    heartbeat_env: SECBOT_TEST_HEARTBEAT_URL
  - name: prod-owner
    env: production
    group: secbot-prod
    bucket_env: SECBOT_PROD_BUCKET
    prefix: owner
    access_key_env: SECBOT_PROD_R2_ACCESS_KEY_ID
    secret_key_env: SECBOT_PROD_R2_SECRET_ACCESS_KEY
  - name: prod-shared
    env: production
    group: secbot-prod
    bucket_env: SECBOT_PROD_BUCKET
    prefix: shared
    access_key_env: SECBOT_PROD_R2_ACCESS_KEY_ID
    secret_key_env: SECBOT_PROD_R2_SECRET_ACCESS_KEY

# The V8 heap limit of every cell isolate (CELLD_V8_HEAP_LIMIT_MB, celld v0.6.1
# crates/celld/env_vars.rs:300; default 128 MiB, crates/celld/js.rs:2345). Raised only when the
# heap measurement goes over it (mise run measure:heap).
celld_v8_heap_limit_mb: 128

# Each fleet unit's resource limits (systemd). A fleet runs several isolates, each up to the heap
# limit above, so the unit's memory cap sits well above one isolate's.
celld_memory_high: 1536M
celld_memory_max: 2G
celld_tasks_max: 512
celld_nofile: 65536

# Replication starts only after the bucket smoke test passed (mise run smoke:r2 and the
# celld diagnose task). Pass -e celld_replication_confirmed=true on that run; it starts the
# test fleet.
celld_replication_confirmed: false

# The production fleets are set up only with -e celld_production=true (the production bucket
# values in the shell), and start only with -e celld_production_confirmed=true after smoke:r2
# passed against the production bucket.
celld_production: false
celld_production_confirmed: false

# celld's own log filter, set as RUST_LOG in the celld@ unit only (never in celld.env.j2: the
# release tool sources the fleet copy of that file before it runs celld CLI commands).
# source: celld v0.6.1 crates/celld/main.rs:3397-3406 reads RUST_LOG through EnvFilter (default
# info), and crates/celld/js.rs:9777-9782 writes every console line of a cell as target
# cell_console at INFO. So "warn" drops celld's per-round replication and node-log INFO lines,
# and "cell_console=info" keeps every cell event (model.call, handoff.*, alarm.*, heartbeat.ping).
# To debug celld itself, set it to "info" for one host setup, then set it back.
celld_log_filter: "warn,cell_console=info"

# The cells log to their own journal namespace, apart from the VPS's system journal, with their
# own retention. Read with: sudo journalctl --namespace=secbot -u celld@<fleet>.
# source: systemd.exec(5) LogNamespace= (systemd 245 or later) and journald.conf(5) for the
# per-namespace file /etc/systemd/journald@<namespace>.conf.
celld_log_namespace: secbot
# Disk cap, space to keep free, the age limit (enough for a monthly cost estimate), and the
# span of one journal file.
celld_journal_max_use: 1G
celld_journal_keep_free: 2G
celld_journal_retention: 90day
celld_journal_max_file: 1week
