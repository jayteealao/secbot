- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# Listed before the cells' restart: handlers run in file order, so the cells reconnect to the
# restarted journal.
- name: Restart the cell journal
  ansible.builtin.systemd_service:
    name: "systemd-journald@{{ celld_log_namespace }}.service"
    state: restarted

- name: Restart celld instances
  ansible.builtin.systemd_service:
    name: "celld@{{ item.name }}"
    state: restarted
  loop: "{{ celld_started_instances }}"
  loop_control:
    label: "celld@{{ item.name }}"
