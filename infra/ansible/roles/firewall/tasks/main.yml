# Firewall rules for the celld ports only. The role never resets ufw, never enables or disables
# it, and never touches the SSH rules or any other rule: the VPS runs other software.
# Binding already keeps the ports private (workers on the private-network address, internal
# listeners on loopback); these rules are the second layer. One worker port and one internal
# port per fleet (celld_ports in group_vars/all.yml).
- name: Admit each fleet's worker port on the private-network interface
  community.general.ufw:
    rule: allow
    # interface_in already makes this an incoming rule; ufw refuses it together with direction.
    interface_in: "{{ celld_private_interface }}"
    port: "{{ item.value.worker | string }}"
    proto: tcp
    comment: "secbot celld {{ item.key }} worker (private network)"
  loop: "{{ celld_ports | dict2items }}"
  loop_control:
    label: "{{ item.key }} {{ item.value.worker }}"

- name: Refuse the celld ports on every other interface
  community.general.ufw:
    rule: deny
    direction: in
    port: "{{ item | string }}"
    proto: tcp
    comment: secbot celld (not public)
  loop: >-
    {{ (celld_ports | dict2items | map(attribute='value.worker') | list)
       + (celld_ports | dict2items | map(attribute='value.internal') | list) }}

- name: Read whether ufw is active
  ansible.builtin.command: ufw status
  register: firewall_ufw_status
  changed_when: false

- name: Warn when ufw is inactive (the rules above wait until the owner enables it)
  ansible.builtin.debug:
    msg: >-
      ufw is inactive, so the rules above are not enforced yet. The listeners are still private
      by binding. Enable ufw yourself after checking your SSH rule; this play never does.
  when: "'Status: active' not in firewall_ufw_status.stdout"
