# Shared by the celld role (listen addresses and ports) and the firewall role (rules).
# One worker port and one internal port per celld instance (fleet).
celld_ports:
  test: { worker: 8787, internal: 8081 }
  prod-owner: { worker: 8788, internal: 8082 }
  prod-shared: { worker: 8789, internal: 8083 }
# The secrets cell's key helper: one loopback port per environment (secbot-key-helper@<env>).
# The firewall role refuses these ports on every interface as a second layer to the binding.
secbot_key_helper_ports:
  test-cell: 8095
  production: 8096
# The private-network interface; the workers listen on its address only.
celld_private_interface: tailscale0
