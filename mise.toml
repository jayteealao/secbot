# Created by wf ship-plan build — plan v1, 2026-10-05
# Patched by wf ship-plan build — plan v2, 2026-10-05
# Single source for tool versions (local, CI, VPS, home Mac) and project tasks.
# Bootstrap a new checkout: mise install && mise run setup

[tools]
node = "24"
pnpm = "10"
java = "temurin-21"
lefthook = "2"
gitleaks = "8"
osv-scanner = "2"
# Infrastructure code (infra/). Ansible runs from Linux or macOS (WSL2 on Windows).
opentofu = "1"
"pipx:ansible-core" = "2"
"pipx:ansible-lint" = "latest"

[tasks.setup]
description = "Install dependencies and the git hooks"
run = ["pnpm install", "lefthook install"]

[tasks.check]
description = "Format, lint, and type-check the TypeScript code"
run = ["pnpm biome ci .", "pnpm -r exec tsc --noEmit"]

[tasks."check:app"]
description = "Lint the Kotlin app (ktlint + detekt)"
run = "./gradlew -p app ktlintCheck detekt"
run_windows = "gradlew.bat -p app ktlintCheck detekt"

[tasks.test]
description = "Run the server and extension tests with coverage (80% lines minimum), then the task-script tests"
run = [
  "pnpm -r exec vitest run --coverage --coverage.thresholds.lines=80",
  "node --test scripts/*.test.mjs",
]

[tasks.build]
description = "Type-check the packages and build the server bundle into dist/ (worker, test-cell worker, VPS tool, manifest)"
run = ["pnpm -r run build", "node scripts/build-bundle.mjs"]

[tasks."check:identifiers"]
description = "Fail when a tracked file holds an IP address, private-network hostname, account id, ping URL, or private key (--staged for the staged files)"
run = "node scripts/check-identifiers.mjs"

[tasks."infra:plan"]
description = "OpenTofu plan for the R2 buckets, their tokens, and the heartbeat (reads TF_VAR_* from your shell)"
dir = "infra/tofu"
run = ["tofu init -input=false", "tofu plan -input=false -out=secbot.tfplan"]

[tasks."infra:apply"]
description = "Apply the reviewed OpenTofu plan (owner only, after reading infra:plan)"
dir = "infra/tofu"
run = "tofu apply -input=false secbot.tfplan"

[tasks."infra:check"]
description = "Static checks of infra/: tofu fmt and validate, ansible-lint, playbook syntax"
# Ansible skips an ansible.cfg in a world-writable working directory (a Windows drive under WSL2);
# ANSIBLE_CONFIG is always read (ansible/config/manager.py find_ini_config_file).
env = { ANSIBLE_CONFIG = "{{config_root}}/infra/ansible/ansible.cfg" }
run = [
  "tofu -chdir=infra/tofu fmt -check -recursive",
  "tofu -chdir=infra/tofu init -backend=false -input=false",
  "tofu -chdir=infra/tofu validate",
  "cd infra/ansible && ansible-galaxy collection install -r requirements.yml && ansible-lint && ansible-playbook --syntax-check site.yml",
]

[tasks."host:setup"]
description = "Run the Ansible host setup on the VPS (SECBOT_VPS_SSH names your SSH alias; its user needs passwordless sudo); prints the diff"
# Ansible skips an ansible.cfg in a world-writable working directory (a Windows drive under WSL2);
# ANSIBLE_CONFIG is always read (ansible/config/manager.py find_ini_config_file).
env = { ANSIBLE_CONFIG = "{{config_root}}/infra/ansible/ansible.cfg" }
dir = "infra/ansible"
run = ["ansible-galaxy collection install -r requirements.yml", "ansible-playbook site.yml --diff"]

[tasks."smoke:r2"]
description = "Prove the bucket refuses a second If-None-Match: * create with 412 (run before replication is turned on)"
run = "node scripts/r2-smoke.mjs"

[tasks."probe:ports"]
description = "Probe the celld ports at SECBOT_PROBE_HOST; every port must refuse or drop the connection"
run = "node scripts/probe-ports.mjs"

[tasks."audit:deps"]
description = "Dependency audit: fail on CVSS >= 7.0, unscored findings, or MAL-* ids unless osv-scanner.toml lists them with a reason and an expiry"
run = "node scripts/audit-deps.mjs"

[tasks."audit:licenses"]
description = "License gate: fail on any dependency license outside the plan's allowlist"
run = "node scripts/check-licenses.mjs"

# Cell tasks. test:conformance, deploy:dry-run, stage, and deploy are real; the tasks after them
# are stubs that fail with a clear message until the production pipeline replaces them.
#
# VPS-side contract for the real tasks (ship plan v2, Blocks A, C, and E):
# - Two VPS users. deploy-test has a forced command that only stages bundles and deploys
#   the test cell. deploy reaches the production cells. Network tags: tag:ci-test, tag:ci-prod.
# - deploy, rollback, and restore each hold one VPS lock for their whole run.
# - The deploy ledger records each approved release, rollback, and restore attempt.
#   ledger:verify fails unless the record matches the run id and attempt and no newer
#   deploy, rollback, or restore exists.
# - deploy refuses a downgrade past a contract step, and refuses a bundle whose
#   SHA-256 differs from the staged one.
# - The release store keeps the last 5 bundles and mirrors each one to the off-provider bucket.

[tasks."test:conformance"]
description = "Run the pi-durable storage conformance suite inside a real celld cell (--target test-cell|local, --long-transaction)"
run = "node scripts/conformance.mjs"

[tasks."deploy:dry-run"]
description = "Build the server bundle and print its manifest; needs no credentials (deploy prints the diff against the live cell)"
run = ["node scripts/build-bundle.mjs", "node scripts/vps.mjs dry-run"]

[tasks.stage]
description = "Stage a server bundle in the VPS release store by tag and SHA-256 (--version --sha256 --file)"
run = "node scripts/vps.mjs stage"

[tasks.deploy]
description = "Deploy a staged tag to an environment (--env test-cell|production --version [--sha256]); holds the VPS lock and refuses a downgrade past a contract step"
run = "node scripts/vps.mjs deploy"

[tasks.snapshot]
description = "Snapshot every cell of an environment to the off-provider bucket under a run-pinned id (pre-<tag>-<run-id>)"
run = "node -e \"console.error('snapshot arrives with the cell-runtime packet (wave 1)'); process.exit(1)\""

[tasks."ledger:record"]
description = "Record an approved release, rollback, or restore attempt in the VPS deploy ledger"
run = "node -e \"console.error('ledger:record arrives with the cell-runtime packet (wave 1)'); process.exit(1)\""

[tasks."ledger:verify"]
description = "Fail unless the deploy ledger holds this run's approved attempt and no newer deploy, rollback, or restore"
run = "node -e \"console.error('ledger:verify arrives with the cell-runtime packet (wave 1)'); process.exit(1)\""

[tasks.restore]
description = "Disaster step: restore one cell from a snapshot under the VPS lock, then confirm it read the outbound-effects log; never the secrets cell"
run = "node -e \"console.error('restore arrives with the cell-runtime packet (wave 1)'); process.exit(1)\""

[tasks."check:cells"]
description = "Check that every cell in an environment is up on a version"
run = "node scripts/vps.mjs check-cells"

[tasks.cli]
description = "Run the secbot command line (chat, missed, model, specialist, device)"
run = "node packages/cli/src/main.ts"

[tasks."check:alarms"]
description = "Check that every cell has its next alarm at or before its earliest routine timer"
run = "node -e \"console.error('check:alarms arrives with the cell-runtime packet (wave 1)'); process.exit(1)\""

[tasks."check:heartbeats"]
description = "Check heartbeat freshness for every cell and routine since the deploy"
run = "node -e \"console.error('check:heartbeats arrives with the cell-runtime packet (wave 1)'); process.exit(1)\""

[tasks."check:app-builds"]
description = "Check the processing state in Play internal testing and TestFlight"
run = "node -e \"console.error('check:app-builds arrives with the access-and-app packet'); process.exit(1)\""

[tasks."app:build-ios"]
description = "Build an unsigned iOS archive"
run = "node -e \"console.error('app:build-ios arrives with the access-and-app packet'); process.exit(1)\""

[tasks."app:sign"]
description = "Sign the Android bundle and export the signed iOS build"
run = "node -e \"console.error('app:sign arrives with the access-and-app packet'); process.exit(1)\""
